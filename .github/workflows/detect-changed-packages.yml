name: Detect Changed Packages

on:
  workflow_call:
    inputs:
      base-ref:
        required: true
        type: string
        description: "Base commit SHA (e.g., before push, or PR base)"
      head-ref:
        required: true
        type: string
        description: "Head commit SHA (e.g., after push, or PR head)"
      fallback-branch:
        required: false
        type: string
        default: "develop"
        description: "Branch to use as fallback when base-ref is unavailable"
    outputs:
      packages:
        description: "JSON array of changed package paths"
        value: ${{ jobs.detect.outputs.packages }}

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.changed.outputs.packages }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine base commit
        id: base
        run: |
          BASE="${{ inputs.base-ref }}"
          HEAD="${{ inputs.head-ref }}"
          FALLBACK="${{ inputs.fallback-branch }}"

          # Если base пустой или равен нулевому хешу (новый бранч) или равен head — используем fallback
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || [ "$BASE" = "$HEAD" ]; then
            git fetch origin "$FALLBACK" --depth=1 || true
            BASE=$(git merge-base "origin/$FALLBACK" "$HEAD" 2>/dev/null || echo "origin/$FALLBACK")
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"

      - name: List all packages
        id: list
        run: |
          ALL_PKGS="$(bash scripts/list-packages.sh --json)"
          echo "all=$ALL_PKGS" >> "$GITHUB_OUTPUT"

      - name: Detect changed packages
        id: changed
        run: |
          ALL_PKGS='${{ steps.list.outputs.all }}'
          BASE="${{ steps.base.outputs.base }}"
          HEAD="${{ inputs.head-ref }}"

          # Для pull_request используем merge-base между base и head,
          # чтобы отсечь изменения, которые уже есть в target ветке.
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            COMPARE_BASE=$(git merge-base "$BASE" "$HEAD")
          else
            COMPARE_BASE="$BASE"
          fi

          CHANGED=()
          for pkg in $(echo "$ALL_PKGS" | jq -r '.[]'); do
            if git diff --name-only "$COMPARE_BASE" "$HEAD" | grep -q "^${pkg}/"; then
              CHANGED+=("$pkg")
            fi
          done

          if [ ${#CHANGED[@]} -eq 0 ]; then
            JSON="[]"
          else
            JSON=$(printf '%s\n' "${CHANGED[@]}" | jq -R . | jq -s -c .)
          fi
          echo "packages=$JSON" >> "$GITHUB_OUTPUT"
