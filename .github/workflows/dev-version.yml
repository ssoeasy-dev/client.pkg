name: Dev Version Management

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]
    branches: [develop, main]

jobs:
  detect-changes:
    name: Detect changed packages
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
    steps:
      - name: Checkout PR Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Detect changed packages
        id: detect
        run: |
          CHANGED="[]"
          BASE="origin/${{ github.base_ref }}"
          if git diff --name-only $BASE...HEAD | grep -q "^core/"; then
            CHANGED=$(echo $CHANGED | jq '. + ["core"]')
          fi
          if git diff --name-only $BASE...HEAD | grep -q "^react/"; then
            CHANGED=$(echo $CHANGED | jq '. + ["react"]')
          fi
          echo "matrix={\"package\":$(echo $CHANGED)}" >> $GITHUB_OUTPUT

  publish:
    name: Publish dev version for ${{ matrix.package }}
    needs: detect-changes
    if: github.event.action != 'closed' && needs.detect-changes.outputs.matrix != '{"package":[]}'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    strategy:
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    steps:
      - name: Checkout PR Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare environment configuration
        working-directory: ${{ matrix.package }}
        run: |
          BRANCH_NAME="${{ github.head_ref }}"
          BRANCH_SLUG=$(echo "$BRANCH_NAME" | sed 's/[^a-zA-Z0-9-]/-/g' | tr '[:upper:]' '[:lower:]')
          CONFIG_FILE="../../env-configs/${BRANCH_SLUG}.env"
          if [ -f "$CONFIG_FILE" ]; then
            cp "$CONFIG_FILE" .env
            echo "✅ Environment config loaded from $CONFIG_FILE"
          else
            echo "❌ Environment config file not found: $CONFIG_FILE"
            exit 1
          fi

      - name: Prepare Dev Version
        id: version
        working-directory: ${{ matrix.package }}
        run: |
          BASE_VERSION=$(node -e "console.log(require('./package.json').version)")
          BRANCH_NAME="${{ github.head_ref }}"
          BRANCH_PART="${BRANCH_NAME//\//-}"
          BRANCH_PART="${BRANCH_PART//_/-}"
          BRANCH_PART=$(echo "$BRANCH_PART" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]//g')

          COMMIT_SHA="${{ github.event.pull_request.head.sha }}"
          COMMIT_SHORT="${COMMIT_SHA:0:7}"

          if [ "${{ github.event.action }}" = "synchronize" ]; then
            VERSION="${BASE_VERSION}-dev-${BRANCH_PART}.${COMMIT_SHORT}"
          else
            VERSION="${BASE_VERSION}-dev-${BRANCH_PART}"
          fi

          NPM_DIST_TAG="dev-${BRANCH_PART}"

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "npm_dist_tag=$NPM_DIST_TAG" >> $GITHUB_OUTPUT

      - name: Update package.json version
        working-directory: ${{ matrix.package }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          node -e "
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.version = '$VERSION';
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Build package
        working-directory: ${{ matrix.package }}
        run: pnpm run build

      - name: Publish npm dev version
        working-directory: ${{ matrix.package }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "⚠️  Warning: NPM_TOKEN secret not set. Skipping npm publish."
            exit 0
          fi
          pnpm publish --no-git-checks --tag ${{ steps.version.outputs.npm_dist_tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Comment on PR
        uses: actions/github-script@v6
        with:
          script: |
            const version = '${{ steps.version.outputs.version }}';
            const npmDistTag = '${{ steps.version.outputs.npm_dist_tag }}';
            const pkgName = '${{ matrix.package }}';
            const fullPkgName = '@ssoeasy-dev/' + pkgName;
            const action = context.payload.action;
            const commitSha = context.payload.pull_request.head.sha.substring(0, 7);

            let title, message;
            if (action === 'synchronize') {
              title = '🔄 Dev Version Updated for ' + pkgName;
              message = `Dev version for \`${pkgName}\` has been updated to the latest commit (\`${commitSha}\`).`;
            } else {
              title = '📦 Dev Version Created for ' + pkgName;
              message = `Dev version for \`${pkgName}\` has been created for this PR.`;
            }

            const body = [
              `## ${title}`,
              '',
              message,
              '',
              '**Usage:**',
              '```bash',
              `npm install ${fullPkgName}@${npmDistTag}`,
              '```',
              '',
              `**NPM version:** \`${version}\` (unique per commit)`,
              '',
              '> ⚠️ This is a temporary development version. It will be automatically updated on each push and deleted after merging this PR.'
            ].join('\n');

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.data.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('Dev Version for ' + pkgName)
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

  cleanup:
    name: Cleanup Dev Versions
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Prepare Dev Version for Cleanup
        id: version
        run: |
          BRANCH_NAME="${{ github.head_ref }}"
          BRANCH_PART="${BRANCH_NAME//\//-}"
          BRANCH_PART="${BRANCH_PART//_/-}"
          BRANCH_PART=$(echo "$BRANCH_PART" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]//g')

          echo "npm_dist_tag=dev-${BRANCH_PART}" >> $GITHUB_OUTPUT
          echo "branch_part=${BRANCH_PART}" >> $GITHUB_OUTPUT

      - name: Unpublish npm dev versions for all packages
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "⚠️  Warning: NPM_TOKEN secret not set. Skipping npm unpublish."
            exit 0
          fi

          NPM_DIST_TAG="${{ steps.version.outputs.npm_dist_tag }}"
          BRANCH_PART="${{ steps.version.outputs.branch_part }}"
          PACKAGES=("core" "react")

          for PKG in "${PACKAGES[@]}"; do
            FULL_PKG="@ssoeasy-dev/${PKG}"
            echo "🗑️  Cleaning up npm versions for package $FULL_PKG with dist-tag $NPM_DIST_TAG"
            
            ALL_VERSIONS=$(npm view $FULL_PKG versions --json 2>/dev/null || echo "[]")
            
            VERSIONS_TO_DELETE=$(echo "$ALL_VERSIONS" | node -e "
              const versions = JSON.parse(require('fs').readFileSync(0, 'utf-8'));
              const branchPart = process.argv[1];
              const matching = versions.filter(v => v.includes('-dev-' + branchPart));
              console.log(matching.join(' '));
            " "$BRANCH_PART")
            
            if [ -n "$VERSIONS_TO_DELETE" ]; then
              echo "📦 Found versions to delete for $FULL_PKG:"
              for VERSION in $VERSIONS_TO_DELETE; do
                echo "   - $VERSION"
              done
              
              for VERSION in $VERSIONS_TO_DELETE; do
                echo -n "   Unpublishing $VERSION... "
                if npm unpublish "$FULL_PKG@$VERSION" 2>/dev/null; then
                  echo "✅"
                else
                  echo "⚠️  (failed or doesn't exist)"
                fi
              done
            else
              echo "ℹ️  No versions found for $FULL_PKG matching pattern: -dev-${BRANCH_PART}"
            fi
            
            echo "🗑️  Removing dist-tag $NPM_DIST_TAG for $FULL_PKG..."
            if npm dist-tag rm $FULL_PKG "$NPM_DIST_TAG" 2>/dev/null; then
              echo "✅ NPM dist-tag $NPM_DIST_TAG removed for $FULL_PKG"
            else
              echo "⚠️  Could not remove dist-tag $NPM_DIST_TAG (may not exist)"
            fi
          done

          echo "✅ Cleanup completed"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
