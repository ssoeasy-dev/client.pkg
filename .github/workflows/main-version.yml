name: Main Version Management

on:
  push:
    branches: [main]

jobs:
  detect-changes:
    name: Detect changed packages
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
    steps:
      - name: Checkout Main Branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Detect changed packages
        id: detect
        run: |
          CHANGED="[]"
          if [ -n "${{ github.event.before }}" ]; then
            BASE="${{ github.event.before }}"
          else
            echo "No previous commit found, publishing all packages"
            CHANGED='["core","react"]'
            echo "matrix={\"package\":$(echo $CHANGED)}" >> $GITHUB_OUTPUT
            exit 0
          fi

          if git diff --name-only $BASE ${{ github.sha }} | grep -q "^core/"; then
            CHANGED=$(echo $CHANGED | jq '. + ["core"]')
          fi
          if git diff --name-only $BASE ${{ github.sha }} | grep -q "^react/"; then
            CHANGED=$(echo $CHANGED | jq '. + ["react"]')
          fi

          echo "matrix={\"package\":$(echo $CHANGED)}" >> $GITHUB_OUTPUT

  publish:
    name: Publish main version for ${{ matrix.package }}
    needs: detect-changes
    if: needs.detect-changes.outputs.matrix != '{"package":[]}'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    steps:
      - name: Checkout Main Branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare environment configuration
        working-directory: ${{ matrix.package }}
        run: |
          BRANCH_SLUG="main"
          CONFIG_FILE="../../env-configs/${BRANCH_SLUG}.env"
          if [ -f "$CONFIG_FILE" ]; then
            cp "$CONFIG_FILE" .env
            echo "✅ Environment config loaded from $CONFIG_FILE"
          else
            echo "❌ Environment config file not found: $CONFIG_FILE"
            exit 1
          fi

      - name: Prepare Main Version
        id: version
        working-directory: ${{ matrix.package }}
        run: |
          VERSION=$(node -e "console.log(require('./package.json').version)")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "dist_tag=latest" >> $GITHUB_OUTPUT

      - name: Check if version already exists
        id: check
        run: |
          FULL_PKG="@ssoeasy-dev/${{ matrix.package }}"
          VERSION="${{ steps.version.outputs.version }}"
          if npm view "$FULL_PKG@$VERSION" version >/dev/null 2>&1; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Build package
        if: steps.check.outputs.skip == 'false'
        working-directory: ${{ matrix.package }}
        run: pnpm run build

      - name: Publish npm main version
        if: steps.check.outputs.skip == 'false'
        working-directory: ${{ matrix.package }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "⚠️  Warning: NPM_TOKEN secret not set. Skipping npm publish."
            exit 0
          fi
          pnpm publish --no-git-checks --tag ${{ steps.version.outputs.dist_tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  cleanup-beta:
    name: Cleanup Beta Versions
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Cleanup beta versions for all packages
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "⚠️  Warning: NPM_TOKEN secret not set. Skipping beta cleanup."
            exit 0
          fi

          PACKAGES=("core" "react")

          for PKG in "${PACKAGES[@]}"; do
            FULL_PKG="@ssoeasy-dev/${PKG}"
            echo "🧹 Cleaning up beta versions for package $FULL_PKG"
            
            ALL_VERSIONS=$(npm view $FULL_PKG versions --json 2>/dev/null || echo "[]")
            
            BETA_VERSIONS=$(echo "$ALL_VERSIONS" | node -e "
              const versions = JSON.parse(require('fs').readFileSync(0, 'utf-8'));
              const betaVersions = versions.filter(v => v.includes('-beta.'));
              console.log(betaVersions.join(' '));
            ")
            
            if [ -n "$BETA_VERSIONS" ]; then
              echo "📦 Found beta versions to cleanup for $FULL_PKG:"
              for VERSION in $BETA_VERSIONS; do
                echo "  - $VERSION"
              done
              
              for VERSION in $BETA_VERSIONS; do
                echo "🗑️  Attempting to unpublish $VERSION..."
                if npm unpublish "$FULL_PKG@$VERSION" 2>/dev/null; then
                  echo "  ✅ Version $VERSION successfully unpublished"
                else
                  echo "  ⚠️  Could not unpublish $VERSION (may be older than 72 hours)"
                fi
              done
            else
              echo "ℹ️  No beta versions found for $FULL_PKG"
            fi
          done

          echo "🗑️  Removing beta dist-tag for all packages..."
          for PKG in "${PACKAGES[@]}"; do
            FULL_PKG="@ssoeasy-dev/${PKG}"
            if npm dist-tag rm $FULL_PKG beta 2>/dev/null; then
              echo "  ✅ Beta dist-tag removed for $FULL_PKG"
            else
              echo "  ℹ️  Beta dist-tag not found or already removed for $FULL_PKG"
            fi
          done

          echo "✅ Beta versions cleanup completed"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
